<!DOCTYPE html>
<!--
  PURAMENTE DANZA 2026 — Panel de la Locutora (interno)
  ----------------------------------------------------------------------
  Herramienta de trabajo para el día del evento: muestra el orden ya
  guardado de ambos días (Sábado/Domingo como pestañas) con las mismas
  columnas que pidió Rebeca, MENOS "Día" (ahora es pestaña) y "ID
  Inscripción" (se usa internamente para guardar el estado, pero no se
  muestra).

  Por cada obra hay tres botones para marcar en vivo cómo va la
  competencia: "En espera", "En escenario" y "No se presenta". Cada
  click guarda al toque en la hoja "Estado_En_Vivo" del backend, y esa
  misma información es la que alimenta al portal público en vivo
  (en-vivo.html).

  Sin login (acceso libre, a pedido) — pensado para compartir el link
  solo con quien está a cargo de locución/control, no para el público
  general ni linkeado desde index.html.
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Panel de la Locutora — Puramente Danza 2026</title>
<link rel="icon" href="assets/iconos/favicon.ico" sizes="any">
<meta name="theme-color" content="#7B2FBE">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#7B2FBE;--pd:#4E1D7F;--a:#F0C078;--txt:#2B2432;--txt-suave:#6E6079;--borde:#E4DAF0;--marfil:#FBF8FF;
  --espera:#EDE3F9;--espera-txt:#4E1D7F;--escena:#7B2FBE;--escena-txt:#ffffff;--nose:#F3F3F3;--nose-txt:#9A9A9A}
body{background:var(--marfil);font-family:'Segoe UI',system-ui,Arial,sans-serif;color:var(--txt);min-height:100vh;font-size:14px}
a{color:inherit}

.topbar{background:linear-gradient(90deg,var(--pd),var(--p));padding:.9rem 1.2rem;position:sticky;top:0;z-index:50;box-shadow:0 4px 14px rgba(53,19,79,.25)}
.topbar-fila{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1200px;margin:0 auto}
.topbar h1{color:#fff;font-size:.95rem;font-weight:800}
.topbar .sub{color:var(--a);font-size:.72rem;font-weight:600;margin-top:1px}
.btn-volver{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;padding:.35rem .8rem;border-radius:99px;font-size:.75rem;text-decoration:none;white-space:nowrap}

.content{max-width:1200px;margin:0 auto;padding:1rem 1rem 3rem}

.dias-tabs{display:flex;gap:.5rem;margin-bottom:.8rem}
.btn-dia{flex:1;padding:.65rem;border:1.5px solid var(--p);border-radius:10px;background:#fff;color:var(--p);font-weight:700;font-size:.88rem;cursor:pointer}
.btn-dia.active{background:var(--p);color:#fff}

.actual-card{background:linear-gradient(90deg,var(--pd),var(--p));color:#fff;border-radius:14px;padding:.9rem 1.1rem;margin-bottom:.8rem;display:none}
.actual-card.visible{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.actual-card .etiqueta{font-size:.68rem;text-transform:uppercase;letter-spacing:.6px;opacity:.85;font-weight:700}
.actual-card .titulo{font-size:1.05rem;font-weight:800;margin-top:2px}
.actual-card .sub{font-size:.78rem;opacity:.9;margin-top:2px}
.actual-card button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);color:#fff;padding:.4rem .8rem;border-radius:99px;font-size:.75rem;font-weight:700;cursor:pointer;white-space:nowrap}

.buscador-wrap{display:flex;align-items:center;gap:.5rem;margin-bottom:.7rem;flex-wrap:wrap}
#buscar{flex:1;min-width:180px;padding:.6rem .9rem;border:1.5px solid var(--borde);border-radius:10px;font-size:.86rem;outline:none}
#buscar:focus{border-color:var(--p)}
.btn-limpiar{background:none;border:1.5px solid var(--borde);border-radius:10px;padding:.55rem .85rem;font-size:.78rem;color:var(--txt-suave);cursor:pointer}
#resultado-info{font-size:.74rem;color:var(--txt-suave);margin:-.25rem 0 .7rem}

.actualizado{font-size:.72rem;color:var(--txt-suave);text-align:right;margin-bottom:.6rem}
.btn-actualizar{background:none;border:none;color:var(--p);font-weight:700;font-size:.75rem;cursor:pointer;text-decoration:underline}

.estado-box{background:#fff;border-radius:12px;padding:1.6rem 1.2rem;text-align:center;color:var(--txt-suave);font-size:.88rem;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.estado-box.error{color:#991B1B;background:#FEF2F2}

.obra-card{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:.85rem 1rem;margin-bottom:.6rem;box-shadow:0 3px 12px rgba(53,19,79,.05)}
.obra-card.es-escenario{border-color:var(--escena);box-shadow:0 4px 18px rgba(123,47,190,.25)}
.obra-card.es-nose{opacity:.55}
.obra-card.resaltada{outline:2px solid var(--p)}

.obra-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:.5rem}
.obra-nro{font-size:1.3rem;font-weight:800;color:var(--pd);min-width:32px}
.obra-info{flex:1;min-width:0}
.obra-titulo{font-weight:700;font-size:.92rem}
.obra-academia{font-size:.78rem;color:var(--txt-suave);margin-top:1px}
.obra-meta{font-size:.72rem;color:var(--txt-suave);margin-top:4px;line-height:1.5}
.obra-meta .badge{display:inline-block;padding:.1rem .5rem;border-radius:99px;font-size:.68rem;font-weight:700;margin-right:4px}
.b-cat{background:#EDE3F9;color:var(--pd)}
.b-mod{background:#FFF3E0;color:#9A6400}
.b-tipo{background:#DCFCE7;color:#166534}
.b-coreo{background:#FFE9F3;color:#9A2359}

.estado-actual-badge{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:.2rem .6rem;border-radius:20px;white-space:nowrap}
.badge-espera{background:var(--espera);color:var(--espera-txt)}
.badge-escena{background:var(--escena);color:var(--escena-txt)}
.badge-nose{background:var(--nose);color:var(--nose-txt)}

.botones-estado{display:flex;gap:6px;flex-wrap:wrap}
.btn-estado{border:1.5px solid var(--borde);background:#fff;color:var(--txt-suave);padding:.4rem .7rem;border-radius:10px;font-size:.74rem;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-estado.activo-espera{background:var(--espera);border-color:var(--espera);color:var(--espera-txt)}
.btn-estado.activo-escena{background:var(--escena);border-color:var(--escena);color:#fff}
.btn-estado.activo-nose{background:var(--nose);border-color:var(--nose);color:var(--nose-txt)}
.btn-estado:disabled{opacity:.55;cursor:default}

.spinner{width:16px;height:16px;border:2.5px solid rgba(123,47,190,.25);border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-3px;margin-right:.4rem}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-fila">
    <div>
      <h1>🎤 Panel de la Locutora</h1>
      <div class="sub">Puramente Danza 2026 — uso interno</div>
    </div>
    <a class="btn-volver" href="orden.html">Orden completo →</a>
  </div>
</div>

<div class="content">

  <div class="dias-tabs">
    <button class="btn-dia active" id="tab-sabado" onclick="cambiarDia('Sábado')">Sábado</button>
    <button class="btn-dia" id="tab-domingo" onclick="cambiarDia('Domingo')">Domingo</button>
  </div>

  <div class="actual-card" id="actual-card">
    <div>
      <div class="etiqueta">Ahora en escenario</div>
      <div class="titulo" id="actual-titulo">—</div>
      <div class="sub" id="actual-sub">—</div>
    </div>
    <button type="button" onclick="irAObraActual()">Ir a esta obra ↓</button>
  </div>

  <div class="buscador-wrap">
    <input type="text" id="buscar" placeholder="🔍 Buscar por obra o academia..." oninput="renderTodo()">
    <button class="btn-limpiar" type="button" onclick="document.getElementById('buscar').value='';renderTodo()">✕ Limpiar</button>
  </div>
  <div id="resultado-info"></div>

  <div class="actualizado" id="actualizado">
    <button class="btn-actualizar" onclick="cargarTodo()">🔄 Actualizar</button>
  </div>

  <div id="contenido">
    <div class="estado-box"><span class="spinner"></span> Cargando el orden...</div>
  </div>

</div>

<script>
window.addEventListener('error', (ev) => {
  console.error('Error en la página:', ev.error || ev.message);
});

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxTzNYtwXPeaE3PBGrGaooxstaHNFd1DcnPVPs2tKnqvse-9X1CSK2nSxRPqalJhGQYw/exec";
const ESTADOS = ['En espera', 'En escenario', 'No se presenta'];
const AUTO_REFRESH_MS = 20000; // por si se usa desde más de un dispositivo a la vez

let DIAS_DATA = { 'Sábado': [], 'Domingo': [] };
let DIA_ACTUAL = 'Sábado';
let CARGANDO = false;
let GUARDANDO = {}; // idInscripcion -> true mientras se está guardando ese click

function escHtml(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalizarTexto(s){
  return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function claseEstado(estado){
  if(estado === 'En escenario') return 'escena';
  if(estado === 'No se presenta') return 'nose';
  return 'espera';
}

async function cargarTodo(silencioso){
  if(CARGANDO) return;
  CARGANDO = true;
  if(!silencioso){
    document.getElementById('contenido').innerHTML = '<div class="estado-box"><span class="spinner"></span> Cargando el orden...</div>';
  }
  try{
    const res = await fetch(SCRIPT_URL + '?action=ordenLocutora&_ts=' + Date.now(), {cache:'no-store'});
    const json = await res.json();
    if(json.ok){
      DIAS_DATA = json.dias || { 'Sábado': [], 'Domingo': [] };
      document.getElementById('actualizado').innerHTML =
        'Actualizado ' + new Date().toLocaleTimeString('es-PY', {hour:'2-digit', minute:'2-digit', second:'2-digit'}) +
        ' · <button class="btn-actualizar" onclick="cargarTodo()">🔄 Actualizar</button>';
      renderTodo();
    } else if(!silencioso){
      document.getElementById('contenido').innerHTML =
        '<div class="estado-box error">❌ No se pudo cargar el orden. Probá de nuevo en unos segundos.<br><br>' +
        '<button class="btn-actualizar" onclick="cargarTodo()">🔄 Reintentar</button></div>';
    }
  }catch(err){
    console.error(err);
    if(!silencioso){
      document.getElementById('contenido').innerHTML =
        '<div class="estado-box error">❌ No se pudo conectar con el servidor. Revisá la conexión y probá de nuevo.<br><br>' +
        '<button class="btn-actualizar" onclick="cargarTodo()">🔄 Reintentar</button></div>';
    }
  }finally{
    CARGANDO = false;
  }
}

function cambiarDia(dia){
  DIA_ACTUAL = dia;
  document.getElementById('tab-sabado').classList.toggle('active', dia==='Sábado');
  document.getElementById('tab-domingo').classList.toggle('active', dia==='Domingo');
  renderTodo();
}

function irAObraActual(){
  const el = document.querySelector('.obra-card.es-escenario');
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}

function renderTodo(){
  const cont = document.getElementById('contenido');
  const infoResultado = document.getElementById('resultado-info');
  const todasDelDia = DIAS_DATA[DIA_ACTUAL] || [];

  const enEscenario = todasDelDia.find(o => o.estado === 'En escenario');
  const actualCard = document.getElementById('actual-card');
  if(enEscenario){
    actualCard.classList.add('visible');
    document.getElementById('actual-titulo').textContent = '#' + enEscenario.posicion + ' — ' + enEscenario.obra;
    document.getElementById('actual-sub').textContent = enEscenario.academia;
  } else {
    actualCard.classList.remove('visible');
  }

  if(!todasDelDia.length){
    infoResultado.textContent = '';
    cont.innerHTML = `<div class="estado-box">Todavía no hay un orden guardado para ${DIA_ACTUAL}. Guardalo desde el panel admin (pestaña Orden Tentativo).</div>`;
    return;
  }

  const termino = normalizarTexto(document.getElementById('buscar').value.trim());
  const obras = todasDelDia.filter(o => !termino || normalizarTexto([o.obra, o.academia].filter(Boolean).join(' ')).includes(termino));

  if(!obras.length){
    infoResultado.textContent = `Sin resultados para "${document.getElementById('buscar').value.trim()}" en ${DIA_ACTUAL}.`;
    cont.innerHTML = `<div class="estado-box">No se encontraron obras que coincidan con la búsqueda en ${DIA_ACTUAL}.</div>`;
    return;
  }
  infoResultado.textContent = termino ? `Mostrando ${obras.length} de ${todasDelDia.length} obra(s) en ${DIA_ACTUAL}` : '';

  cont.innerHTML = obras.map(o => {
    const clase = claseEstado(o.estado);
    const guardandoEsta = !!GUARDANDO[o.idInscripcion];
    const metaBadges = `
      ${o.categoria ? `<span class="badge b-cat">${escHtml(o.categoria)}</span>` : ''}
      ${o.modalidad ? `<span class="badge b-mod">${escHtml(o.modalidad)}</span>` : ''}
      ${o.tipoParticipacion ? `<span class="badge b-tipo">${escHtml(o.tipoParticipacion)}</span>` : ''}
      ${o.competeCoreografia === 'Sí' ? `<span class="badge b-coreo">Compite por coreografía</span>` : ''}
    `;
    return `
      <div class="obra-card es-${clase} ${termino ? 'resaltada' : ''}">
        <div class="obra-top">
          <div class="obra-nro">${o.posicion}</div>
          <div class="obra-info">
            <div class="obra-titulo">${escHtml(o.obra || '(sin nombre)')}</div>
            <div class="obra-academia">${escHtml(o.academia || '')}</div>
            <div class="obra-meta">
              ${metaBadges}
              ${o.participantes ? '<br>👤 ' + escHtml(o.participantes) : ''}
              ${o.coreografo ? '<br>🎬 Coreógrafa/o: ' + escHtml(o.coreografo) : ''}
            </div>
          </div>
          <span class="estado-actual-badge badge-${clase}">${escHtml(o.estado)}</span>
        </div>
        <div class="botones-estado">
          ${ESTADOS.map(estado => `
            <button type="button" class="btn-estado ${o.estado === estado ? 'activo-' + claseEstado(estado) : ''}"
              ${guardandoEsta ? 'disabled' : ''}
              onclick="marcarEstado('${o.idInscripcion}', '${estado}')">
              ${estado === 'En espera' ? '⏳' : estado === 'En escenario' ? '🎭' : '🚫'} ${estado}
            </button>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

async function marcarEstado(idInscripcion, estado){
  GUARDANDO[idInscripcion] = true;
  renderTodo();
  try{
    const fd = new FormData();
    fd.append('action', 'guardarEstadoEnVivo');
    fd.append('idInscripcion', idInscripcion);
    fd.append('estado', estado);
    const res = await fetch(SCRIPT_URL, {method:'POST', body:fd});
    const json = await res.json();
    if(!json.ok){
      alert('No se pudo guardar el estado: ' + (json.error || 'error desconocido'));
    }
    await cargarTodo(true);
  }catch(err){
    console.error(err);
    alert('No se pudo conectar con el servidor para guardar el estado. Probá de nuevo.');
  }finally{
    delete GUARDANDO[idInscripcion];
    renderTodo();
  }
}

document.getElementById('tab-sabado').onclick = () => cambiarDia('Sábado');
document.getElementById('tab-domingo').onclick = () => cambiarDia('Domingo');

cargarTodo();
setInterval(() => cargarTodo(true), AUTO_REFRESH_MS);
</script>
</body>
</html>
